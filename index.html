<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Théo Gaggio - Product Designer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bento-container">
        <!-- Profile Sidebar -->
        <aside class="profile-section">
            <div class="profile-wrapper">
                <div class="avatar-container">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200&h=200&fit=crop&crop=faces" alt="Théo Gaggio" class="avatar">
                </div>
                <h1 class="name">Théo Gaggio</h1>
                <p class="title">Product Designer for Betclic Group 👨‍🎨</p>
            </div>
            <div class="profile-footer">
                <button class="btn-login">Log In</button>
                <button class="btn-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
                    </svg>
                </button>
            </div>
        </aside>

        <!-- Main Bento Grid -->
        <main class="bento-main">
            <!-- Réseaux Section -->
            <section class="bento-section">
                <h2 class="section-label">Réseaux 📲</h2>
                <div class="cards-row">
                    <!-- LinkedIn -->
                    <a href="https://www.linkedin.com/in/theogaggio" target="_blank" class="card card-linkedin">
                        <div class="card-top">
                            <div class="linkedin-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                                </svg>
                            </div>
                            <div class="linkedin-avatar">
                                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop&crop=faces" alt="">
                            </div>
                        </div>
                        <div class="card-bottom">
                            <span class="link-title">www.linkedin.com</span>
                            <span class="link-domain">linkedin.com</span>
                        </div>
                    </a>

                    <!-- Figma -->
                    <div class="card card-figma">
                        <div class="figma-top">
                            <div class="figma-icon">
                                <svg width="20" height="30" viewBox="0 0 38 57" fill="none">
                                    <path d="M19 28.5C19 23.2533 23.2533 19 28.5 19C33.7467 19 38 23.2533 38 28.5C38 33.7467 33.7467 38 28.5 38C23.2533 38 19 33.7467 19 28.5Z" fill="#1ABCFE"/>
                                    <path d="M0 47.5C0 42.2533 4.25329 38 9.5 38H19V47.5C19 52.7467 14.7467 57 9.5 57C4.25329 57 0 52.7467 0 47.5Z" fill="#0ACF83"/>
                                    <path d="M19 0V19H28.5C33.7467 19 38 14.7467 38 9.5C38 4.25329 33.7467 0 28.5 0H19Z" fill="#FF7262"/>
                                    <path d="M0 9.5C0 14.7467 4.25329 19 9.5 19H19V0H9.5C4.25329 0 0 4.25329 0 9.5Z" fill="#F24E1E"/>
                                    <path d="M0 28.5C0 33.7467 4.25329 38 9.5 38H19V19H9.5C4.25329 19 0 23.2533 0 28.5Z" fill="#A259FF"/>
                                </svg>
                            </div>
                            <div class="figma-meta">
                                <span class="figma-title">Figma</span>
                                <span class="figma-handle">@gz76</span>
                            </div>
                        </div>
                        <div class="figma-grid">
                            <div class="figma-placeholder"></div>
                            <div class="figma-placeholder"></div>
                            <div class="figma-placeholder"></div>
                            <div class="figma-placeholder"></div>
                            <div class="figma-placeholder"></div>
                            <div class="figma-placeholder"></div>
                        </div>
                        <a href="https://figma.com/@gz76" target="_blank" class="btn-follow">Follow</a>
                    </div>
                </div>
            </section>

            <!-- Behance Section -->
            <section class="bento-section">
                <div class="card card-behance">
                    <div class="behance-top">
                        <div class="behance-icon">
                            <svg width="28" height="18" viewBox="0 0 72 45" fill="white">
                                <path d="M27.8 32.4c0 7.7-5.7 11-11 11H0V1.6h15.7c5.7 0 10.3 2.9 10.3 9.4 0 4-2.1 6.7-5.2 8 4 1.1 7 4.5 7 13.4zm-17.4-19h5c3 0 4.7-1.3 4.7-4.2s-1.4-4-4.5-4h-5.2v8.2zm0 16.2h5.7c3.3 0 5.2-1.6 5.2-5s-1.7-5.2-5.4-5.2h-5.5v10.2zM72 27.2H45.7c.4 5.3 3 7.8 7 7.8 3.2 0 5.4-1.6 6.3-4.4h12.3c-2 8-8.5 12.5-18.7 12.5-12.2 0-19.4-8-19.4-18.6s7.6-18.8 19.3-18.8c12.4 0 19.5 9 19.5 19.2v2.3zM45.8 20.5h14c-.3-4.5-3-6.8-6.8-6.8-4 0-6.6 2.5-7.2 6.8zM44 0h18.3v5.6H44V0z"/>
                            </svg>
                        </div>
                        <span class="behance-title">Behance</span>
                        <a href="https://behance.net/theogaggio" target="_blank" class="btn-follow btn-behance">
                            Follow <span class="follow-badge">2</span>
                        </a>
                    </div>
                    <div class="behance-grid">
                        <div class="behance-thumb" style="background-image: url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=300&h=200&fit=crop');"></div>
                        <div class="behance-thumb" style="background-image: url('https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=300&h=200&fit=crop');"></div>
                        <div class="behance-thumb" style="background-image: url('https://images.unsplash.com/photo-1559028012-481c04fa702d?w=300&h=200&fit=crop');"></div>
                        <div class="behance-thumb" style="background-image: url('https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=300&h=200&fit=crop');"></div>
                        <div class="behance-thumb" style="background-image: url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=300&h=200&fit=crop');"></div>
                        <div class="behance-thumb" style="background-image: url('https://images.unsplash.com/photo-1555421689-491a97ff2040?w=300&h=200&fit=crop');"></div>
                    </div>
                </div>
            </section>

            <!-- Design Section -->
            <section class="bento-section">
                <h2 class="section-label">Design 📊</h2>
                <div class="cards-row cards-design">
                    <!-- Portfolio -->
                    <a href="https://theogaggio-portfolio.webflow.io" target="_blank" class="card card-portfolio">
                        <div class="portfolio-top">
                            <div class="portfolio-avatar">
                                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=50&h=50&fit=crop&crop=faces" alt="">
                            </div>
                            <div class="portfolio-meta">
                                <span class="portfolio-name">Théo - Product Designer</span>
                                <span class="portfolio-url">theogaggio-portfolio.webflow.io</span>
                            </div>
                        </div>
                        <div class="portfolio-preview">
                            <div class="browser-window">
                                <div class="browser-bar">
                                    <span class="dot red"></span>
                                    <span class="dot yellow"></span>
                                    <span class="dot green"></span>
                                    <span class="browser-address">theogaggio-portfolio.webflow.io</span>
                                </div>
                                <div class="browser-body">
                                    <div class="mock-nav"></div>
                                    <div class="mock-content">
                                        <div class="mock-line"></div>
                                        <div class="mock-line short"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </a>

                    <!-- Device Mockup -->
                    <div class="card card-device">
                        <div class="device-wrapper">
                            <div class="macbook">
                                <div class="macbook-screen">
                                    <div class="screen-inner"></div>
                                </div>
                                <div class="macbook-bottom">
                                    <div class="macbook-notch"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Extra Section -->
            <section class="bento-section">
                <h2 class="section-label">Extra ✨</h2>
                <div class="cards-row cards-extra">
                    <a href="mailto:theo@gaggio.fr" class="card card-small card-email">
                        <div class="small-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="4" width="20" height="16" rx="2"/>
                                <path d="M22 6L12 13 2 6"/>
                            </svg>
                        </div>
                        <span class="small-label">Email</span>
                    </a>
                    <a href="https://twitter.com/theogaggio" target="_blank" class="card card-small card-twitter">
                        <div class="small-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                            </svg>
                        </div>
                        <span class="small-label">Twitter</span>
                    </a>
                    <div class="card card-small card-location">
                        <div class="small-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
                                <circle cx="12" cy="10" r="3"/>
                            </svg>
                        </div>
                        <span class="small-label">Bordeaux 🇫🇷</span>
                    </div>
                    <div class="card card-small card-status">
                        <div class="status-dot"></div>
                        <span class="small-label">Available</span>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
